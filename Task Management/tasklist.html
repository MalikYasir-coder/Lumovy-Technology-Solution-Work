<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Management App</title>
<!-- <script src="tasklist.js" ></script> -->
<link rel="stylesheet" href="tasklist.css">
</head>
<body>

<h1>Task Management App</h1>
<p class="subtitle">Add and manage your daily tasks.</p>

<label for="taskInput">Task Title</label>
<div class="input-row">
  <input type="text" id="taskInput" placeholder="Enter a task">
  <button id="addBtn">Add Task</button>
</div>

<h2>Task Summary</h2>
<p id="totalTasks">Total Tasks: 0</p>

<h2>Tasks</h2>
<p id="emptyMsg">No tasks available.</p>
<ul id="taskList"></ul>
<script src="tasklist.js" ></script>
</body>
</html>
